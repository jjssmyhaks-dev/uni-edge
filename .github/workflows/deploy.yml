name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Vercel CLI
        run: pnpm add -g vercel
      - name: Pull Vercel Environment
        run: cd apps/web && vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: cd apps/web && vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: cd apps/web && vercel --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
